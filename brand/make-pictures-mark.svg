<svg width="512" height="512" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="mp_bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>
    <linearGradient id="mp_back" x1="30" y1="30" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7209B7"/>
      <stop offset="100%" stop-color="#3A0CA3"/>
    </linearGradient>
    <linearGradient id="mp_mid" x1="50" y1="45" x2="185" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#0096C7"/>
    </linearGradient>
    <linearGradient id="mp_front" x1="65" y1="65" x2="205" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A85"/>
      <stop offset="55%" stop-color="#FF5E00"/>
      <stop offset="100%" stop-color="#FFBE0B"/>
    </linearGradient>
    <filter id="mp_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Clean Light Studio Background -->
  <rect width="240" height="240" rx="56" fill="url(#mp_bg)"/>

  <!-- Layered Frames in Motion -->
  <g filter="url(#mp_shadow)">
    <!-- Back Frame (Electric Violet) -->
    <rect x="34" y="34" width="124" height="124" rx="30" transform="rotate(-10 96 96)" fill="url(#mp_back)" />
    <!-- Middle Frame (Cyber Cyan) -->
    <rect x="52" y="50" width="128" height="128" rx="32" transform="rotate(-3 116 114)" fill="url(#mp_mid)" />
    <!-- Front Hero Frame (Coral -> Orange -> Solar Amber) -->
    <rect x="70" y="68" width="134" height="134" rx="34" fill="url(#mp_front)" />
    <!-- Crisp White Play Symbol inside Front Frame -->
    <path d="M119 109.5C119 104.8 124.1 101.9 128.2 104.3L166.8 127.2C170.8 129.6 170.8 135.4 166.8 137.8L128.2 160.7C124.1 163.1 119 160.2 119 155.5V109.5Z" fill="#FFFFFF"/>
    <!-- Signature Dot in Top-Right of Front Frame -->
    <circle cx="182" cy="90" r="8" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
